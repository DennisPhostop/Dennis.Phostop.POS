plugins {
    id "com.android.application"
}

def signingStorePath = System.getenv("ANDROID_SIGNING_STORE_FILE")
def signingStorePassword = System.getenv("ANDROID_SIGNING_STORE_PASSWORD")
def signingKeyAlias = System.getenv("ANDROID_SIGNING_KEY_ALIAS")
def signingKeyPassword = System.getenv("ANDROID_SIGNING_KEY_PASSWORD")

android {
    namespace "com.dennisphostop.pos"
    compileSdk 35

    defaultConfig {
        applicationId "com.dennisphostop.pos"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            if (signingStorePath) {
                storeFile file(signingStorePath)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
