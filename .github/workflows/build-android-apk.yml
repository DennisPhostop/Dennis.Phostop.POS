name: Build Android Printer APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-printer/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android-printer
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp android-printer/app/build/outputs/apk/debug/app-debug.apk Dennis-Phostop-POS-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Dennis-Phostop-POS-Android
          path: Dennis-Phostop-POS-debug.apk
          retention-days: 30
